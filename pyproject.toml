[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-support-collab"
version = "0.1.0"
description = "A controlled learning-support and tutoring collaboration training prototype"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7.0"]

[tool.setuptools.packages.find]
where = ["src"]
