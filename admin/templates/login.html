<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录｜学习支持协作实验室</title><link rel="stylesheet" href="{{ url_for('static', path='admin.css') }}"></head><body><form class="login" method="post" action="/login"><h1>管理后台登录</h1><p class="muted">使用已初始化的系统管理员账号登录。</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<label>邮箱</label><input name="email" type="email" required autocomplete="email"><label>密码</label><input name="password" type="password" required autocomplete="current-password"><p><button class="button" type="submit">安全登录</button></p><p class="muted">首次运行请先执行管理员初始化命令。</p></form></body></html>
