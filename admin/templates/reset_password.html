{% extends "base.html" %}{% block title %}重置密码{% endblock %}{% block section %}治理 / 用户与权限 / 重置密码{% endblock %}{% block heading %}重置密码{% endblock %}
{% block content %}<section class="panel form-panel"><div class="panel-head"><div><h3>重置 {{ target.display_name }} 的密码</h3><p>{{ target.email }}</p></div></div><form method="post" class="account-form"><label>新密码<input name="password" type="password" required autocomplete="new-password"></label><label>确认新密码<input name="confirm_password" type="password" required autocomplete="new-password"></label><p class="muted">至少 10 位，同时包含大写字母、小写字母和数字。密码内容不会进入审计日志。</p><div class="form-actions"><button class="button" type="submit">确认重置</button><a class="button secondary" href="/admin/users">取消</a></div></form></section>{% endblock %}
