{% extends "base.html" %}
{% block title %}创建账号{% endblock %}{% block section %}治理 / 用户与权限 / 创建账号{% endblock %}{% block heading %}创建账号{% endblock %}
{% block content %}<section class="panel form-panel"><div class="panel-head"><div><h3>新增平台成员</h3><p>邮箱将作为登录账号，创建后即可使用。</p></div></div><form method="post" class="account-form"><div class="grid"><label>姓名<input name="display_name" required maxlength="80" autocomplete="name"></label><label>邮箱<input name="email" type="email" required maxlength="254" autocomplete="email"></label><label>角色<select name="role">{% for role in roles %}<option value="{{ role }}">{{ role }}</option>{% endfor %}</select></label></div><div class="grid"><label>初始密码<input name="password" type="password" required autocomplete="new-password"></label><label>确认密码<input name="confirm_password" type="password" required autocomplete="new-password"></label></div><p class="muted">至少 10 位，同时包含大写字母、小写字母和数字。</p><div class="form-actions"><button class="button" type="submit">创建账号</button><a class="button secondary" href="/admin/users">取消</a></div></form></section>{% endblock %}
