{% extends "base.html" %}{% block title %}修改密码{% endblock %}{% block section %}账号安全 / 修改密码{% endblock %}{% block heading %}修改密码{% endblock %}
{% block content %}<section class="panel form-panel"><div class="panel-head"><div><h3>更新登录密码</h3><p>{{ user.email }}</p></div></div><form method="post" class="account-form"><label>当前密码<input name="current_password" type="password" required autocomplete="current-password"></label><label>新密码<input name="password" type="password" required autocomplete="new-password"></label><label>确认新密码<input name="confirm_password" type="password" required autocomplete="new-password"></label><p class="muted">修改成功后系统会退出当前会话，请使用新密码重新登录。</p><div class="form-actions"><button class="button" type="submit">保存新密码</button><a class="button secondary" href="/admin">取消</a></div></form></section>{% endblock %}
